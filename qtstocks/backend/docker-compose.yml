services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5555:5555"
      - "5678:5678"
    volumes:
      - .:/app:cached
      - /app/venv
      - /app/__pycache__
      - /app/*.pyc
      - /app/.pytest_cache
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/qtstocks
      - FLASK_RUN_PORT=5555
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONBREAKPOINT=0
    command: python -m debugpy --listen 0.0.0.0:5678 -m flask run --reload --debugger --host=0.0.0.0
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=qtstocks
    ports:
      - "5432:5432"

volumes:
  postgres_data: 